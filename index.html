<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>अनकहे लफ्ज़</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd700">

<style>

body{
  margin:0;
  font-family: system-ui;
  background:#fce4ec;
}

/* SPLASH */
#splash{
  position:fixed;
  width:100%;
  height:100%;
  background:#ffd700;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:bold;
  z-index:9999;
  animation:fadeOut 2s forwards;
}

@keyframes fadeOut{
  0%{opacity:1;}
  100%{opacity:0; visibility:hidden;}
}

/* HEADER */
.header{
  background:#ffd700;
  padding:15px;
  text-align:center;
  font-size:20px;
}

/* =========================
   ✨ SHINY GLASS BUTTONS
========================= */

button, .fab, .saveBtn, .back{
  position:relative;
  overflow:hidden;

  border:none;
  border-radius:16px;
  cursor:pointer;
  color:white;

  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border:1px solid rgba(255,255,255,0.35);

  box-shadow:
    0 8px 25px rgba(0,0,0,0.25),
    inset 0 1px 12px rgba(255,255,255,0.35);

  transition:0.3s ease;
}

/* SHINE EFFECT */
button::before,
.fab::before,
.saveBtn::before,
.back::before{
  content:"";
  position:absolute;
  top:-60%;
  left:-70%;
  width:40%;
  height:200%;
  background: rgba(255,255,255,0.45);
  transform: rotate(25deg);
  transition:0.6s;
}

button:hover::before,
.fab:hover::before,
.saveBtn:hover::before,
.back:hover::before{
  left:120%;
}

/* HOVER */
button:hover,
.fab:hover,
.saveBtn:hover,
.back:hover{
  transform:scale(1.08);
  box-shadow:
    0 12px 35px rgba(0,0,0,0.35),
    inset 0 1px 18px rgba(255,255,255,0.5);
}

/* CLICK */
button:active,
.fab:active,
.saveBtn:active,
.back:active{
  transform:scale(0.95);
}

/* TOP BUTTONS */
.topBtns{
  text-align:center;
  margin:10px;
}

.topBtns button{
  padding:10px 14px;
  margin:5px;
}

/* LIST */
.list{
  padding:10px;
}

.card{
  background:white;
  padding:15px;
  margin-bottom:10px;
  border-radius:12px;
}

/* FLOAT BUTTON */
.fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  font-size:30px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* EDITOR */
#editor{
  display:none;
  height:100vh;
  padding:15px;
  box-sizing:border-box;
  flex-direction:column;
}

#title{
  font-size:20px;
  border:none;
  outline:none;
}

#content{
  flex:1;
  border:none;
  outline:none;
  resize:none;
}

/* BACK */
.back{
  padding:8px 14px;
  display:inline-block;
  margin-bottom:10px;
}

/* SAVE */
.saveBtn{
  padding:12px;
  width:100%;
}

</style>
</head>

<body>

<div id="splash">अनकहे लफ्ज़</div>

<div class="header">अनकहे लफ्ज़</div>

<div class="topBtns">
  <button onclick="exportData()">📤 Backup</button>
  <input type="file" id="importFile" onchange="importData()" style="display:none;">
  <button onclick="document.getElementById('importFile').click()">📥 Restore</button>
</div>

<div id="listPage" class="list"></div>

<div id="editor">
  <div class="back" onclick="goBack()">← Back</div>

  <input id="title" placeholder="Title">
  <textarea id="content" placeholder="Write your kavita..."></textarea>

  <button class="saveBtn" onclick="save()">Save</button>
</div>

<div class="fab" onclick="newNote()">+</div>

<script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

let notes = JSON.parse(localStorage.getItem("kavita")||"[]");
let current = null;

function load(){
  let list = document.getElementById("listPage");
  list.innerHTML="";

  notes.slice().reverse().forEach((n,i)=>{
    let div = document.createElement("div");
    div.className="card";

    div.onclick = ()=>openNote(notes.length-1-i);

    div.innerHTML = `
      <h3>${n.title || "No Title"}</h3>
      <p>${(n.content||"").substring(0,60)}...</p>
    `;

    list.appendChild(div);
  });
}

function newNote(){
  current = null;
  document.getElementById("title").value="";
  document.getElementById("content").value="";
  openEditor();
}

function openNote(i){
  current = i;
  let n = notes[i];

  document.getElementById("title").value=n.title;
  document.getElementById("content").value=n.content;

  openEditor();
}

function openEditor(){
  document.getElementById("listPage").style.display="none";
  document.getElementById("editor").style.display="flex";
}

function save(){
  let t = document.getElementById("title").value;
  let c = document.getElementById("content").value;

  let data = {
    title:t,
    content:c,
    date:new Date().toLocaleString()
  };

  if(current==null){
    notes.push(data);
  } else {
    notes[current]=data;
  }

  localStorage.setItem("kavita", JSON.stringify(notes));
  goBack();
}

function goBack(){
  document.getElementById("editor").style.display="none";
  document.getElementById("listPage").style.display="block";
  load();
}

function exportData(){
  let data = localStorage.getItem("kavita") || "[]";
  let blob = new Blob([data], {type:"application/json"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kavita_backup.json";
  a.click();
}

function importData(){
  let file = document.getElementById("importFile").files[0];
  if(!file) return;

  let reader = new FileReader();
  reader.onload = function(){
    localStorage.setItem("kavita", reader.result);
    alert("Backup Restored ✅");
    location.reload();
  };
  reader.readAsText(file);
}

load();

</script>

</body>
  </html>
