<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>अनकहे लफ्ज़</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd700">

<style>
body{
  margin:0;
  font-family: system-ui;
  background:#111; /* dark for glass effect */
  color:white;
}

/* SPLASH */
#splash{
  position:fixed;
  width:100%;
  height:100%;
  background:#ffd700;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:bold;
  z-index:9999;
  animation:fadeOut 2s forwards;
}

@keyframes fadeOut{
  0%{opacity:1;}
  100%{opacity:0; visibility:hidden;}
}

/* HEADER */
.header{
  background:#222;
  padding:15px;
  text-align:center;
  font-size:20px;
}

/* =========================
   💎 LIQUID GLASS BUTTON
========================= */

.liquid-btn{
  position: relative;
  padding: 12px 20px;
  margin:5px;
  border-radius: 50px;
  border: none;
  cursor: pointer;

  color: white;
  font-size: 14px;
  font-weight: 500;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  box-shadow:
    0 8px 25px rgba(0,0,0,0.6),
    inset 0 2px 6px rgba(255,255,255,0.25),
    inset 0 -2px 6px rgba(0,0,0,0.6);

  border: 1px solid rgba(255,255,255,0.2);

  overflow: hidden;
}

/* top shine */
.liquid-btn::after{
  content:"";
  position:absolute;
  top:5%;
  left:10%;
  width:80%;
  height:40%;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0.4),
    transparent
  );
  border-radius:50px;
}

/* bottom glow */
.liquid-btn::before{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:3px;
  background: linear-gradient(90deg, transparent, gold, transparent);
}

/* hover */
.liquid-btn:hover{
  transform: translateY(-3px);
}

/* click */
.liquid-btn:active{
  transform: scale(0.97);
}

/* TOP BUTTONS */
.topBtns{
  text-align:center;
  margin:10px;
}

/* LIST */
.list{
  padding:10px;
}

.card{
  background:#1e1e1e;
  padding:15px;
  margin-bottom:10px;
  border-radius:12px;
}

/* FLOAT BUTTON */
.fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 8px 25px rgba(0,0,0,0.6);
}

/* EDITOR */
#editor{
  display:none;
  height:100vh;
  padding:15px;
  box-sizing:border-box;
  flex-direction:column;
}

#title{
  font-size:20px;
  border:none;
  outline:none;
  background:transparent;
  color:white;
}

#content{
  flex:1;
  border:none;
  outline:none;
  resize:none;
  background:transparent;
  color:white;
}

/* BACK */
.back{
  margin-bottom:10px;
}

/* SAVE */
.saveBtn{
  width:100%;
}

</style>
</head>

<body>

<div id="splash">अनकहे लफ्ज़</div>

<div class="header">अनकहे लफ्ज़</div>

<div class="topBtns">
  <button class="liquid-btn" onclick="exportData()">📤 Backup</button>
  <input type="file" id="importFile" onchange="importData()" style="display:none;">
  <button class="liquid-btn" onclick="document.getElementById('importFile').click()">📥 Restore</button>
</div>

<div id="listPage" class="list"></div>

<div id="editor">
  <button class="liquid-btn back" onclick="goBack()">← Back</button>

  <input id="title" placeholder="Title">
  <textarea id="content" placeholder="Write your kavita..."></textarea>

  <button class="liquid-btn saveBtn" onclick="save()">Save</button>
</div>

<div class="fab" onclick="newNote()">+</div>

<script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

let notes = JSON.parse(localStorage.getItem("kavita")||"[]");
let current = null;

function load(){
  let list = document.getElementById("listPage");
  list.innerHTML="";

  notes.slice().reverse().forEach((n,i)=>{
    let div = document.createElement("div");
    div.className="card";

    div.onclick = ()=>openNote(notes.length-1-i);

    div.innerHTML = `
      <h3>${n.title || "No Title"}</h3>
      <p>${(n.content||"").substring(0,60)}...</p>
    `;

    list.appendChild(div);
  });
}

function newNote(){
  current = null;
  document.getElementById("title").value="";
  document.getElementById("content").value="";
  openEditor();
}

function openNote(i){
  current = i;
  let n = notes[i];

  document.getElementById("title").value=n.title;
  document.getElementById("content").value=n.content;

  openEditor();
}

function openEditor(){
  document.getElementById("listPage").style.display="none";
  document.getElementById("editor").style.display="flex";
}

function save(){
  let t = document.getElementById("title").value;
  let c = document.getElementById("content").value;

  let data = {
    title:t,
    content:c,
    date:new Date().toLocaleString()
  };

  if(current==null){
    notes.push(data);
  } else {
    notes[current]=data;
  }

  localStorage.setItem("kavita", JSON.stringify(notes));
  goBack();
}

function goBack(){
  document.getElementById("editor").style.display="none";
  document.getElementById("listPage").style.display="block";
  load();
}

function exportData(){
  let data = localStorage.getItem("kavita") || "[]";
  let blob = new Blob([data], {type:"application/json"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kavita_backup.json";
  a.click();
}

function importData(){
  let file = document.getElementById("importFile").files[0];
  if(!file) return;

  let reader = new FileReader();
  reader.onload = function(){
    localStorage.setItem("kavita", reader.result);
    alert("Backup Restored ✅");
    location.reload();
  };
  reader.readAsText(file);
}

load();

</script>

</body>
    </html>
