<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Poem App</title>

<style>

/* Background */
body{
    margin:0;
    font-family: Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#1e1e2f,#2b5876,#4e4376);
}

/* App Box */
.app{
    width:90%;
    max-width:400px;
    padding:20px;
    text-align:center;
}

/* Title */
h1{
    color:white;
    margin-bottom:20px;
}

/* Glass Button Style */
.glass-btn{
    width:100%;
    padding:15px;
    margin:10px 0;
    font-size:18px;
    color:white;
    border:none;
    border-radius:15px;

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.25);

    cursor:pointer;
    transition: 0.3s ease;
}

/* Hover Effect */
.glass-btn:hover{
    transform: scale(1.05);
    background: rgba(255,255,255,0.25);
}

/* Active Effect */
.glass-btn:active{
    transform: scale(0.95);
}

/* Different colors */
.save{ background: rgba(0,255,150,0.2); }
.back{ background: rgba(255,100,100,0.2); }
.add{ background: rgba(100,150,255,0.2); }

/* Poem Box */
.poem-box{
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    background: rgba(255,255,255,0.1);
    color:white;
    backdrop-filter: blur(10px);
}

textarea{
    width:100%;
    height:120px;
    border:none;
    border-radius:10px;
    padding:10px;
    outline:none;
    resize:none;
}

</style>
</head>

<body>

<div class="app">

    <h1>✨ My Poem App ✨</h1>

    <!-- Poem Input -->
    <div class="poem-box">
        <textarea placeholder="Write your poem here..."></textarea>
    </div>

    <!-- Glass Buttons -->
    <button class="glass-btn save">💾 Save Poem</button>
    <button class="glass-btn add">➕ Add New Poem</button>
    <button class="glass-btn back">⬅ Back</button>

</div>

</body>
</html>
